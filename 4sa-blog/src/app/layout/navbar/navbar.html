<nav class="navbar">
  <a routerLink="/" class="brand">
    <i class="bi bi-journal-book brand-icon" aria-hidden="true"></i>
    <span class="brand-text">{{ 'nav.brand' | translate }}</span>
  </a>
  <div class="navbar-center">
    <label class="search-wrap">
      <i class="bi bi-search search-icon" aria-hidden="true"></i>
      <input
        type="search"
        class="search-input"
        [placeholder]="'nav.searchPlaceholder' | translate"
        [attr.aria-label]="'nav.searchPlaceholder' | translate"
        autocomplete="off"
      />
    </label>
  </div>
  <div class="navbar-end">
    <button
      type="button"
      class="lang-toggle"
      (click)="toggleLang()"
      [attr.aria-label]="'nav.switchLang' | translate"
      [title]="'nav.switchLang' | translate"
    >
      <i class="bi bi-globe2 lang-icon" aria-hidden="true"></i>
      <span class="lang-label">{{ currentLangLabel }}</span>
    </button>
  </div>
</nav>
