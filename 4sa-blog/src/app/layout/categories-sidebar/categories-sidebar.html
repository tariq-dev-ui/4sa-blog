<section class="categories-strip" [attr.aria-label]="'sections.title' | translate">
  <nav class="categories-drawer">
    <div class="categories-strip-arrows">
      <button
        type="button"
        class="categories-arrow categories-arrow-prev"
        [class.categories-arrow--disabled]="!canScrollPrev()"
        [attr.aria-disabled]="!canScrollPrev()"
        (click)="scrollPrev()"
        [attr.aria-label]="'sections.prev' | translate"
      >
        <i
          class="bi"
          [class.bi-chevron-right]="isRtl()"
          [class.bi-chevron-left]="!isRtl()"
          aria-hidden="true"
        ></i>
      </button>
    </div>

    <div class="drawer-scroll" #drawerScroll (scroll)="updateScrollState()">
      <ul class="drawer-list">
        @for (cat of categories; track cat.slug || 'all') {
          <li class="drawer-item">
            <a
              [routerLink]="cat.slug ? ['/categories', cat.slug] : ['/categories']"
              class="drawer-link"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !cat.slug }"
            >
              <span class="drawer-link-icon" aria-hidden="true">
                <i class="bi drawer-icon" [ngClass]="cat.icon"></i>
              </span>
              <span class="drawer-text">{{ cat.labelKey | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="categories-strip-arrows">
      <button
        type="button"
        class="categories-arrow categories-arrow-next"
        [class.categories-arrow--disabled]="!canScrollNext()"
        [attr.aria-disabled]="!canScrollNext()"
        (click)="scrollNext()"
        [attr.aria-label]="'sections.next' | translate"
      >
        <i
          class="bi"
          [class.bi-chevron-left]="isRtl()"
          [class.bi-chevron-right]="!isRtl()"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </nav>
</section>
