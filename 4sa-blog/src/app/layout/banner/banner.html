<section
  class="banner"
  [attr.aria-label]="'banner.ariaLabel' | translate"
>
  <div class="banner-row">
    <div class="banner-item">
      <a
        [href]="banner.link || '#'"
        class="banner-link"
        [attr.aria-label]="banner.title"
      >
        <span class="banner-img-wrap">
          <img
            [src]="banner.image"
            [alt]="banner.title || ''"
            class="banner-image"
            loading="eager"
            fetchpriority="high"
          />
        </span>
      </a>
    </div>
  </div>
</section>
